<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>Thai Gala - Fight Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:wght@700;800&family=Oswald:wght@600;700&family=Poppins:wght@700;800&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20251121">
  <script>
    // Early apply of persisted background color & headline size to prevent flicker.
    (function(){
      function slugKey(){
        try {
          var path = (window.location && window.location.pathname) ? window.location.pathname : '/';
          var slug = path.replace(/^\/+/, '').replace(/[^a-z0-9_-]+/gi,'-');
          return slug || 'root';
        } catch(_) {
          return 'root';
        }
      }
      function storageKey(name){ return 'lf_'+slugKey()+'_'+name; }
      function getItem(name){
        try { return localStorage.getItem(storageKey(name)); } catch(_){ return null; }
      }
      function setHelpers(){
        try {
          window.__viewerStorageGet = getItem;
          window.__viewerStorageSet = function(name, value){ try{ localStorage.setItem(storageKey(name), value); }catch(_){ } };
          window.__viewerStorageRemove = function(name){ try{ localStorage.removeItem(storageKey(name)); }catch(_){ } };
        }catch(_){ }
      }
      setHelpers();
      try {
        var bg = getItem('eventBgColor');
        if (bg) {
          document.addEventListener('DOMContentLoaded', function(){
            if (!document.body) return;
            var low = String(bg).toLowerCase();
            if (low.indexOf('gradient|') === 0){
              var parts = String(bg).split('|');
              var c1 = (parts[1] || '').trim();
              var c2 = (parts[2] || '').trim();
              var ok1 = /^#?[0-9a-fA-F]{6}$/.test(c1);
              var ok2 = /^#?[0-9a-fA-F]{6}$/.test(c2);
              if (ok1 && ok2){
                var n1 = c1.charAt(0)==='#' ? c1 : ('#'+c1);
                var n2 = c2.charAt(0)==='#' ? c2 : ('#'+c2);
                document.body.style.background = 'linear-gradient(160deg, ' + n1 + ' 0%, ' + n2 + ' 100%)';
                return;
              }
            }
            if (/^#?[0-9a-fA-F]{6}$/.test(String(bg).replace('#',''))) {
              document.body.style.background = String(bg).charAt(0)==='#' ? bg : ('#'+bg);
            }
          });
        }
        var size = getItem('eventSize'); // tenths of rem
        if (size && /^(\d+)$/.test(size)) {
          var n = parseInt(size,10);
          if (Number.isFinite(n) && n>=6 && n<=80){ // 0.6rem .. 8.0rem range in tenths
            var rem = (n/10).toFixed(1)+'rem';
            var st = document.createElement('style');
            st.textContent = '.event-title{font-size:'+rem+' !important}';
            document.head.appendChild(st);
          }
        }
      }catch(e){ /* ignore */ }
    })();
  </script>
  <!--
    If you deploy the static site to GitHub Pages and run the admin server elsewhere,
    set the server origin here so clients connect to the deployed server for
    real-time admin updates.
    Example (uncomment and edit):
      <script>window.SERVER_ORIGIN = 'https://loyalty-fights.onrender.com'</script>
    Leave commented to default to the page's own origin (useful for local testing).
  -->
</head>
<body class="boot">
  <!-- header removed -->

  <main class="fight-main">
  <img id="eventImage" alt="Event" class="event-image" style="display:none;margin:.6rem auto .3rem;max-height:160px;width:auto" />
  <h1 id="eventTitle" class="event-title event-title--fx">&nbsp;</h1>
    <div class="event-info" id="eventInfoDisplay" aria-live="polite"></div>
    <div class="now-strip">
      <div>Nu:</div>
      <div id="nowDisplay" class="now-match"></div>
    </div>
    <div id="ringTimer" class="ring-timer ring-timer-popup" style="display:none" aria-live="polite">
      <button id="ringTimerClose" class="ring-timer-close" type="button" aria-label="Close timer popup">×</button>
      <div id="ringTimerPhase" class="ring-timer-phase">START AGAIN IN</div>
      <div id="ringTimerClock" class="ring-timer-clock">03:00</div>
    </div>
    <button id="ringTimerOpen" class="ring-timer-open" type="button" style="display:none" aria-label="Open timer popup">Show Timer</button>
  <section id="fightList" class="cards fight-cards" aria-live="polite"></section>

    
    <section class="loyalty-footer">
    <div style="text-align:center;margin-bottom:.6rem">
      <img id="footnoteImage" alt="Foot note" style="max-width:160px;width:28%;height:auto;display:none" />
    </div>
    <div class="card-download-wrap">
      <button id="downloadCardPdfBtn" type="button" class="card-download-btn" aria-label="Download card as PDF">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 10l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Download Card PDF</span>
      </button>
    </div>
    <div id="socialBar" class="social-bar" aria-live="polite"></div>
    </section>
    <footer class="site-footer"></footer>
  </main>


  <!-- QR modal removed -->

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <!-- SheetJS for .xlsx/.xls parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="fightcard.js?v=20251122"></script>
  <!-- Viewer WebSocket client: lightweight external file that listens for {type:'state'} broadcasts
       and applies them to the renderer (preserves compact HTML). -->
  <script>
    // Ensure the viewer points to the running admin server for live updates.
    // Falls back to localhost:3000 if opened from file:// or another origin.
    window.SERVER_ORIGIN = window.SERVER_ORIGIN || (location.origin.startsWith('http') ? location.origin : 'http://localhost:3000');
  </script>
  <script src="ws-client.js?v=20251122"></script>
  <script>
    // Maintain year stamp only when element exists
    (function(){
      var y = document.getElementById('year');
      if (y) y.textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
